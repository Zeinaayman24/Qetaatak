<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />

    <meta name="description" content="اطلب أي قطعة لعربيتك، المحلات والتشاليح تبعتلك أسعارها، واختار الأحسن." />
    <link rel="manifest" href="/daghta/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/daghta/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ضغطة" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #041D3F;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* The app is pinned to the whole screen. A height (100%, 100dvh) is unreliable on iPhones when the app is
         added to the home screen: it can come out shorter than the screen and the page can shift, leaving empty
         bands above and below. Pinning all four edges always fills the screen, under the clock too. */
      #root {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
    </style>
    <script>
      /* iOS 26 home-screen apps: Safari can give the page a viewport shorter than the screen (by about the
         status-bar height), leaving an empty band at the bottom. When that happens, stretch the app down to the
         real bottom of the screen. Only in the home-screen app, only portrait, only for a small difference. */
      (function () {
        if (!window.navigator.standalone && !(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)) return;
        function fit() {
          var root = document.getElementById('root');
          if (!root) return;
          // measure the box the app really gets (iOS can report a full window height while giving less)
          document.documentElement.style.height = ''; document.body.style.height = '';
          root.style.position = ''; root.style.height = ''; root.style.bottom = '0px';
          var h = root.getBoundingClientRect().height;
          var portrait = h > window.innerWidth;
          var gap = portrait ? window.screen.height - h : 0;
          var html = document.documentElement, body = document.body;
          if (gap > 0 && gap < 120) {
            // iPhone does not draw fixed elements past its short viewport, so lay the app out as a normal page
            // exactly as tall as the screen; the page itself can't scroll (body overflow is hidden)
            var full = window.screen.height + 'px';
            html.style.height = full; body.style.height = full;
            root.style.position = 'absolute'; root.style.bottom = 'auto'; root.style.height = full;
            window.scrollTo(0, 0);
          } else {
            html.style.height = ''; body.style.height = '';
            root.style.position = ''; root.style.height = '';
          }
        }
        // put the page back if the keyboard pushed it up
        document.addEventListener('focusout', function () { setTimeout(function () { window.scrollTo(0, 0); }, 50); });
        function soon() { fit(); setTimeout(fit, 150); setTimeout(fit, 600); setTimeout(fit, 1500); }
        document.addEventListener('DOMContentLoaded', soon);
        window.addEventListener('load', soon);
        window.addEventListener('resize', soon);
        window.addEventListener('pageshow', soon);
        window.addEventListener('orientationchange', function () { setTimeout(soon, 300); });
        document.addEventListener('visibilitychange', function () { if (!document.hidden) soon(); });
      })();
    </script>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/daghta/sw.js', { scope: '/daghta/' }).catch(function () {}); });
      }
    </script>
  </body>
</html>
