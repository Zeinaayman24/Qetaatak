    <link rel="manifest" href="/daghta/manifest.webmanifest" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #F6F7F9;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* The app is pinned to the whole screen. A height (100%, 100dvh) is unreliable on iPhones when the app is
         added to the home screen: it can come out shorter than the screen and the page can shift, leaving empty
         bands above and below. Pinning all four edges always fills the screen, under the clock too. */
      #root {
        display: flex;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
    </style>
  </head>

  <body>
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/daghta/sw.js', { scope: '/daghta/' }).catch(function () {}); });
      }
    </script>
  </body>
</html>
